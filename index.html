
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>شهرسازی سه‌بعدی</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Tahoma;background:#9ac9e8;color:white}
canvas{display:block}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;gap:8px}
.panel{background:#17283beF;border:1px solid #ffffff35;border-radius:14px;padding:12px;font-size:13px;box-shadow:0 4px 18px #14243855}
#money{color:#ffe27a;font-weight:bold}
#menu{position:fixed;bottom:12px;left:8px;right:8px;display:flex;gap:8px;overflow-x:auto;padding:10px;background:#14263aee;border-radius:18px;z-index:5}
.item{min-width:76px;background:#2b4058;border:1px solid #ffffff30;color:white;border-radius:12px;padding:9px 5px;font-family:Tahoma}
.item.active{background:#087f9d;border:2px solid #75e8ff}
.item span{display:block;font-size:25px;margin-bottom:5px}
#tip{position:fixed;top:65px;left:12px;background:#17283bd9;padding:9px;border-radius:10px;font-size:11px;z-index:5}
#tools{position:fixed;right:12px;top:65px;display:grid;gap:7px;z-index:5}
.tool{background:#17283bee;color:white;border:1px solid #ffffff35;padding:10px;border-radius:11px}
</style>
</head>
<body>
<div id="top">
 <div class="panel">🏙️ شهر من</div>
 <div class="panel">💰 <span id="money">10000</span></div>
</div>
<div id="tip">برای ساخت روی زمین بزن؛ برای چرخش دوربین انگشتت را بکش.</div>
<div id="tools">
 <button class="tool" id="rotate">🔄 چرخش</button>
 <button class="tool" id="zoomIn">＋ زوم</button>
 <button class="tool" id="zoomOut">－ زوم</button>
</div>
<div id="menu">
 <button class="item active" data-type="house"><span>🏠</span>خانه ۵۰۰</button>
 <button class="item" data-type="tower"><span>🏢</span>برج ۱۵۰۰</button>
 <button class="item" data-type="school"><span>🏫</span>مدرسه ۱۰۰۰</button>
 <button class="item" data-type="hospital"><span>🏥</span>بیمارستان ۱۳۰۰</button>
 <button class="item" data-type="shop"><span>🏬</span>فروشگاه ۹۰۰</button>
 <button class="item" data-type="park"><span>🌳</span>پارک ۴۰۰</button>
 <button class="item" data-type="road"><span>🛣️</span>خیابان ۱۰۰</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc9e8);
scene.fog=new THREE.Fog(0x9bc9e8,65,125);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,180);
let angle=Math.PI/4, distance=47, height=37;
function updateCamera(){
 camera.position.set(Math.sin(angle)*distance,height,Math.cos(angle)*distance);
 camera.lookAt(0,0,0);
}
updateCamera();

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9efff,0x657b56,2));
const sun=new THREE.DirectionalLight(0xfff0d2,2.7);
sun.position.set(-25,45,25);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-35;
sun.shadow.camera.right=35;
sun.shadow.camera.top=35;
sun.shadow.camera.bottom=-35;
sun.shadow.bias=-.0004;
scene.add(sun);

const material=(color,roughness=.85,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const grass=material(0x65a85b);
const asphalt=material(0x343e4b);
const pavement=material(0xb7b8ad);
const white=material(0xf5eee0);
const glass=material(0x78c7e7,.25,.15);
const darkGlass=material(0x31536d,.3);
const red=material(0xc95c49);
const yellow=material(0xf0c66d);
const wood=material(0x805536);
const leaves=material(0x287d46);
const lightMat=material(0xffdf8c,.35);
const line=material(0xf4d77a);

const box=new THREE.BoxGeometry(1,1,1);
const sphere=new THREE.SphereGeometry(.5,10,8);
const cone=new THREE.ConeGeometry(.7,1,6);

function cube(parent,x,y,z,sx,sy,sz,mat,shadow=true){
 const m=new THREE.Mesh(box,mat);
 m.position.set(x,y,z);
 m.scale.set(sx,sy,sz);
 m.castShadow=shadow;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}
function addTree(parent,x,z,size=1){
 cube(parent,x,.65*size,z,.18*size,1.3*size,.18*size,wood);
 const a=new THREE.Mesh(sphere,leaves);
 a.position.set(x,1.55*size,z);
 a.scale.set(size,size*1.15,size);
 a.castShadow=true;
 parent.add(a);
}
function addWindow(parent,x,y,z,w=.32,h=.42){
 cube(parent,x,y,z,w,h,.055,darkGlass,false);
 cube(parent,x,y,z+.035,w*.86,h*.86,.02,glass,false);
}
function addLamp(parent,x,z){
 cube(parent,x,1.4,z,.09,2.8,.09,wood);
 const l=new THREE.Mesh(sphere,lightMat);
 l.position.set(x,2.9,z);
 l.scale.set(.22,.22,.22);
 parent.add(l);
}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(130,130),grass);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.12;
ground.receiveShadow=true;
scene.add(ground);

const grid=new THREE.GridHelper(64,32,0x477e49,0x80b675);
grid.position.y=.01;
scene.add(grid);

const city=new THREE.Group();
scene.add(city);

function makeRoad(g){
 cube(g,0,.04,0,4,.12,4,asphalt);
 cube(g,0,.108,0,.12,.015,3.4,line,false);
 for(let z=-1.3;z<=1.3;z+=.8){
  cube(g,-1.8,.115,z,.12,.02,.35,white,false);
  cube(g,1.8,.115,z,.12,.02,.35,white,false);
 }
}
function makePark(g){
 cube(g,0,.12,0,3.7,.2,3.7,material(0x8bc66d));
 addTree(g,-1,-.9,.85);
 addTree(g,1,.8,.9);
 addTree(g,.9,-1,.75);
 const bench=material(0x87542f);
 cube(g,0,.35,.7,1,.12,.3,bench);
 cube(g,0,.2,.7,1,.15,.12,wood);
}
function makeHouse(g){
 const walls=material(0xf1c985);
 cube(g,0,1.35,0,2.5,2.7,2.4,walls);
 const r=new THREE.Mesh(cone,red);
 r.position.set(0,3.2,0);
 r.scale.set(2,1.2,2);
 r.castShadow=true;
 g.add(r);
 for(let x of [-.7,.7]){
  addWindow(g,x,1.9,1.22,.45,.55);
  addWindow(g,x,1.9,-1.22,.45,.55);
 }
 cube(g,0,.65,1.23,.48,1.3,.08,wood);
 cube(g,0,3.85,0,.35,.45,.35,material(0x777777));
}
function makeTower(g){
 const floors=7;
 cube(g,0,3.4,0,2.6,6.8,2.6,material(0xc9d7df));
 for(let y=.6;y<6.5;y+=.8){
  for(let x of [-.85,0,.85]){
   addWindow(g,x,y,1.32,.55,.48);
   addWindow(g,x,y,-1.32,.55,.48);
  }
  cube(g,0,y-.35,0,2.72,.08,2.72,white);
 }
 cube(g,0,6.95,0,2.9,.2,2.9,red);
}
function makeSchool(g){
 cube(g,0,1.3,0,3.1,2.6,2.7,material(0xe8d9ae));
 for(let x of [-1,0,1]){
  addWindow(g,x,1.7,1.38,.55,.6);
 }
 cube(g,0,.7,1.4,.8,1.4,.12,red);
 cube(g,0,2.8,0,3.25,.2,2.85,red);
}
function makeHospital(g){
 cube(g,0,1.6,0,3.2,3.2,2.8,white);
 for(let x of [-1,0,1]){
  addWindow(g,x,2,1.42,.5,.65);
 }
 cube(g,0,3.4,0,3.35,.18,2.95,white);
 cube(g,0,3.9,0,1.2,.65,.18,red);
 cube(g,0,3.9,0,.18,.65,1.2,red);
}
function makeShop(g){
 cube(g,0,1.2,0,3,2.4,2.7,yellow);
 cube(g,0,.85,1.4,2.3,.85,.12,glass);
 cube(g,0,2.5,0,3.2,.25,2.9,red);
 cube(g,0,2.9,0,1.4,.35,.12,white);
}
const prices={house:500,tower:1500,school:1000,hospital:1300,shop:900,park:400,road:100};
let money=10000,selected='house';
const occupied=new Set();

function makeBuilding(type,x,z){
 const g=new THREE.Group();
 const shadow=new THREE.Mesh(
  new THREE.CircleGeometry(2.1,16),
  new THREE.MeshBasicMaterial({color:0x253b2a,transparent:true,opacity:.18})
 );
 shadow.rotation.x=-Math.PI/2;
 shadow.position.y=.015;
 shadow.scale.set(1,.8,1);
 g.add(shadow);

 if(type==='road')makeRoad(g);
 if(type==='park')makePark(g);
 if(type==='house')makeHouse(g);
 if(type==='tower')makeTower(g);
 if(type==='school')makeSchool(g);
 if(type==='hospital')makeHospital(g);
 if(type==='shop')makeShop(g);

 if(type!=='road'&&type!=='park'){
  addLamp(g,-1.7,1.6);
  addLamp(g,1.7,-1.6);
 }
 g.position.set(x,0,z);
 city.add(g);
}

document.querySelectorAll('.item').forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  selected=b.dataset.type;
 };
});

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const hit=new THREE.Vector3();
let down=false,moved=false,lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
 down=true;moved=false;lastX=e.clientX;lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!down)return;
 const dx=e.clientX-lastX,dy=e.clientY-lastY;
 if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
 if(moved){
  angle-=dx*.006;
  height=Math.max(13,Math.min(65,height+dy*.08));
  updateCamera();
 }
 lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener('pointerup',e=>{
 if(down&&!moved)place(e);
 down=false;
});
function place(e){
 const r=renderer.domElement.getBoundingClientRect();
 pointer.x=(e.clientX-r.left)/r.width*2-1;
 pointer.y=-(e.clientY-r.top)/r.height*2+1;
 raycaster.setFromCamera(pointer,camera);
 if(!raycaster.ray.intersectPlane(plane,hit))return;
 const x=Math.round(hit.x/4)*4,z=Math.round(hit.z/4)*4;
 const k=x+','+z;
 if(Math.abs(x)>28||Math.abs(z)>28||occupied.has(k))return;
 if(money<prices[selected])return;
 money-=prices[selected];
 document.querySelector('#money').textContent=money.toLocaleString('fa-IR');
 occupied.add(k);
 makeBuilding(selected,x,z);
}
document.querySelector('#zoomIn').onclick=()=>{
 distance=Math.max(19,distance-4);updateCamera();
};
document.querySelector('#zoomOut').onclick=()=>{
 distance=Math.min(85,distance+4);updateCamera();
};
document.querySelector('#rotate').onclick=()=>{
 angle+=Math.PI/4;updateCamera();
};
renderer.domElement.addEventListener('wheel',e=>{
 distance=Math.max(19,Math.min(85,distance+e.deltaY*.035));
 updateCamera();
},{passive:true});

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
}
addEventListener('resize',resize);

function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
