<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>شهر من 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101827;font-family:Tahoma;color:white}
#game{width:100vw;height:100dvh;display:block}
#panel{position:fixed;top:10px;right:10px;left:10px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px}
.info{background:#172438eF;padding:11px 15px;border:1px solid #ffffff22;border-radius:14px;font-size:13px}
#money{color:#ffe36c;font-weight:bold}
#menu{position:fixed;bottom:12px;left:8px;right:8px;z-index:5;background:#142238ed;border:1px solid #ffffff22;border-radius:18px;padding:10px;display:flex;gap:7px;overflow-x:auto}
.item{min-width:76px;border:1px solid #ffffff25;background:#263953;color:white;border-radius:12px;padding:9px 5px;font-size:12px}
.item.active{background:#087d9e;border:2px solid #61e5ff}
.item span{display:block;font-size:24px;margin-bottom:5px}
#help{position:fixed;top:65px;left:10px;z-index:5;background:#172438c9;padding:8px 11px;border-radius:10px;font-size:11px}
button{font-family:Tahoma;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="panel">
 <div class="info">🏙️ شهر من</div>
 <div class="info">💰 <span id="money">5000</span> سکه</div>
</div>
<div id="help">برای ساخت، روی زمین لمس کن؛ برای چرخاندن دوربین بکش.</div>
<div id="menu">
 <button class="item active" data-type="house"><span>🏠</span>خانه<br>۵۰۰</button>
 <button class="item" data-type="tower"><span>🏢</span>برج<br>۱۲۰۰</button>
 <button class="item" data-type="school"><span>🏫</span>مدرسه<br>۹۰۰</button>
 <button class="item" data-type="hospital"><span>🏥</span>بیمارستان<br>۱۱۰۰</button>
 <button class="item" data-type="shop"><span>🏬</span>فروشگاه<br>۸۰۰</button>
 <button class="item" data-type="park"><span>🌳</span>پارک<br>۳۰۰</button>
 <button class="item" data-type="road"><span>🛣️</span>جاده<br>۱۰۰</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.querySelector('#game');
const renderer=new THREE.WebGLRenderer({
 canvas,antialias:true,alpha:false,powerPreference:'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=false;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd5ec);
scene.fog=new THREE.Fog(0x9bd5ec,35,85);

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,150);
let angle=Math.PI/4, distance=35, height=27;
function cameraUpdate(){
 camera.position.set(Math.cos(angle)*distance,height,Math.sin(angle)*distance);
 camera.lookAt(0,0,0);
}
cameraUpdate();

scene.add(new THREE.HemisphereLight(0xffffff,0x66805d,2));
const sun=new THREE.DirectionalLight(0xffffff,2.1);
sun.position.set(-15,30,15);
scene.add(sun);

const mats={};
function mat(name,color,rough=.85){
 if(!mats[name])mats[name]=new THREE.MeshLambertMaterial({color});
 return mats[name];
}
const grass=mat('grass',0x65a957);
const white=mat('white',0xf4eee1);
const dark=mat('dark',0x34465b);
const glass=mat('glass',0x65c6e8);
const roof=mat('roof',0xc65b43);
const roadMat=mat('road',0x424b58);
const lineMat=mat('line',0xf5d879);
const trunk=mat('trunk',0x79502e);
const leaf=mat('leaf',0x23834b);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),grass);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.08;
scene.add(ground);

const grid=new THREE.GridHelper(50,25,0x477b45,0x78ad65);
grid.position.y=.01;
scene.add(grid);

const buildings=new THREE.Group();
scene.add(buildings);

const geo={
 box:new THREE.BoxGeometry(1,1,1),
 cone:new THREE.ConeGeometry(.7,1,5),
 cylinder:new THREE.CylinderGeometry(.12,.15,1,7),
 sphere:new THREE.SphereGeometry(.55,8,6)
};

function cube(parent,x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(geo.box,material);
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);
 parent.add(m);return m;
}
function tree(parent,x,z,size=1){
 cube(parent,x,.55*size,z,.16*size,1.1*size,.16*size,trunk);
 const top=new THREE.Mesh(geo.sphere,leaf);
 top.position.set(x,1.35*size,z);
 top.scale.set(size,size,size);
 parent.add(top);
}
function windowBox(parent,x,y,z,w=.23,h=.32){
 cube(parent,x,y,z,w,h,.045,glass);
}
function makeBuilding(type,x,z){
 const g=new THREE.Group();
 const baseY=0;
 const colors={
 house:0xf3c77d,tower:0xcbd9e5,school:0xe9dfbd,
 hospital:0xf1f3f6,shop:0xe5a6a0
 };
 if(type==='road'){
  cube(g,0,.03,0,2,.08,2,roadMat);
  cube(g,0,.08,0,.12,.02,1.7,lineMat);
 }else if(type==='park'){
  cube(g,0,.08,0,1.9,.12,1.9,mat('park',0x85c96c));
  tree(g,-.45,0,.8);tree(g,.45,.4,.75);tree(g,.35,-.5,.65);
 }else{
  let h=type==='tower'?5:type==='hospital'?2.6:type==='school'?2.2:1.8;
  let w=type==='tower'?1.65:1.55;
  cube(g,0,h/2,0,w,h,w,mat(type,colors[type]));
  cube(g,0,h+.12,0,w+.12,.2,w+.12,white);
  if(type==='house'){
   const r=new THREE.Mesh(geo.cone,roof);
   r.position.y=h+.65;r.scale.set(1.35,1,1.35);g.add(r);
   cube(g,0,.48,.79,.38,.95,.08,dark);
  }else{
   for(let y=.55;y<h-.25;y+=.65){
    for(let xx=-.48;xx<=.5;xx+=.48){
     windowBox(g,xx,y,w/2+.03);
     windowBox(g,xx,y,-w/2-.03);
    }
   }
   if(type==='hospital'){
    cube(g,0,h+.45,0,.75,.12,.16,mat('red',0xe54b50));
    cube(g,0,h+.45,0,.16,.12,.75,mat('red',0xe54b50));
   }
   if(type==='school'){
    cube(g,0,.55,.82,.55,1,.08,roof);
   }
   if(type==='shop'){
    cube(g,0,.7,.82,1.05,.55,.08,glass);
   }
  }
 }
 // سایه مصنوعی سبک
 const shadow=new THREE.Mesh(
  new THREE.CircleGeometry(1.15,12),
  new THREE.MeshBasicMaterial({color:0x243b2a,transparent:true,opacity:.18})
 );
 shadow.rotation.x=-Math.PI/2;
 shadow.position.y=.015;
 shadow.scale.set(1,.75,1);
 g.add(shadow);
 g.position.set(x,baseY,z);
 buildings.add(g);
 return g;
}

let money=5000;
let selected='house';
const prices={house:500,tower:1200,school:900,hospital:1100,shop:800,park:300,road:100};
const occupied=new Set();
function key(x,z){return x+','+z}
document.querySelectorAll('.item').forEach(btn=>{
 btn.addEventListener('click',()=>{
  document.querySelectorAll('.item').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');selected=btn.dataset.type;
 });
});

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const hit=new THREE.Vector3();
let dragging=false,lastX=0,lastY=0,moved=false;

function place(e){
 const r=canvas.getBoundingClientRect();
 pointer.x=((e.clientX-r.left)/r.width)*2-1;
 pointer.y=-((e.clientY-r.top)/r.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 if(!raycaster.ray.intersectPlane(groundPlane,hit))return;
 const x=Math.round(hit.x/2)*2,z=Math.round(hit.z/2)*2;
 const k=key(x,z);
 if(Math.abs(x)>22||Math.abs(z)>22||occupied.has(k))return;
 const price=prices[selected];
 if(money<price){alert('سکه کافی نداری!');return;}
 money-=price;
 document.querySelector('#money').textContent=money;
 occupied.add(k);
 makeBuilding(selected,x,z);
}

canvas.addEventListener('pointerdown',e=>{
 dragging=true;moved=false;lastX=e.clientX;lastY=e.clientY;
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
 if(!dragging)return;
 const dx=e.clientX-lastX,dy=e.clientY-lastY;
 if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
 if(moved){
  angle-=dx*.006;
  height=Math.max(12,Math.min(42,height+dy*.08));
  cameraUpdate();
 }
 lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener('pointerup',e=>{
 if(dragging&&!moved)place(e);
 dragging=false;
});
canvas.addEventListener('wheel',e=>{
 distance=Math.max(18,Math.min(55,distance+e.deltaY*.025));
 cameraUpdate();
},{passive:true});

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);

function animate(){
 requestAnimationFrame(animate);
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
