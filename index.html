
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D City Builder</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17212b;color:white;font-family:Arial;overflow:hidden}
#game{width:100vw;height:100dvh;display:block}
#ui{position:absolute;top:10px;left:10px;right:10px;pointer-events:none}
.panel{background:#17212be8;padding:12px;border-radius:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
button{border:0;border-radius:10px;padding:11px;background:#268b63;color:white;font-weight:bold}
#tools{position:absolute;bottom:12px;left:8px;right:8px;background:#17212bee;border-radius:15px;padding:9px;display:flex;gap:7px;overflow-x:auto}
#tools button{min-width:75px;display:flex;flex-direction:column;align-items:center;gap:5px}
#tools button.active{background:#e29b28;color:#171717}
#hint{position:absolute;top:76px;left:10px;background:#17212bdc;padding:9px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div id="game"></div>
<div id="ui">
 <div class="panel">
  <b>🏙️ CITY BUILDER 3D</b>
  <span>💰 <span id="money">1500</span></span>
  <span>🏠 <span id="count">0</span></span>
 </div>
</div>
<div id="hint">برای ساخت، روی زمین لمس کن. برای چرخش، انگشت را بکش.</div>
<div id="tools">
 <button class="active" data-type="house">🏠<small>خانه 100</small></button>
 <button data-type="tower">🏢<small>برج 300</small></button>
 <button data-type="school">🏫<small>مدرسه 180</small></button>
 <button data-type="hospital">🏥<small>بیمارستان 250</small></button>
 <button data-type="park">🌳<small>پارک 80</small></button>
 <button data-type="shop">🏪<small>فروشگاه 150</small></button>
 <button data-type="road">🛣️<small>خیابان 40</small></button>
 <button id="collect">💰<small>دریافت پول</small></button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd3ef);
scene.fog=new THREE.Fog(0x9bd3ef,25,65);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,1000);
camera.position.set(15,17,20);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x557044,2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(10,20,10);
sun.castShadow=true;
scene.add(sun);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(50,50),
 new THREE.MeshStandardMaterial({color:0x71a95e})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

const grid=new THREE.GridHelper(40,20,0x628b53,0x8bb477);
grid.position.y=.015;
scene.add(grid);

const roadMat=new THREE.MeshStandardMaterial({color:0x414850});
const whiteMat=new THREE.MeshStandardMaterial({color:0xffffff});
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const buildings=[];
const occupied=new Set();
let money=1500;
let selected='house';
let cameraAngle=Math.PI/4;
let cameraRadius=26;
let cameraHeight=19;
let target=new THREE.Vector3(0,0,0);

const costs={house:100,tower:300,school:180,hospital:250,park:80,shop:150,road:40};

function material(color){return new THREE.MeshStandardMaterial({color,roughness:.8});}
function cube(parent,x,y,z,w,h,d,color){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 m.position.set(x,y+h/2,z);
 m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function roof(parent,x,y,z,w,h,d,color){
 const m=new THREE.Mesh(new THREE.ConeGeometry(w*.75,h,4),material(color));
 m.position.set(x,y+h/2,z);
 m.rotation.y=Math.PI/4;
 m.castShadow=true;parent.add(m);
}
function tree(parent,x,z){
 const trunk=cube(parent,x,0,z,.25,1,.25,0x79502e);
 const leaves=new THREE.Mesh(new THREE.IcosahedronGeometry(.9,1),material(0x268349));
 leaves.position.set(x,1.8,z);leaves.castShadow=true;
 parent.add(leaves);
}
function makeBuilding(type,x,z){
 const g=new THREE.Group();
 g.position.set(x,0,z);
 if(type==='road'){
  cube(g,0,.02,0,1.9,.06,1.9,0x414850);
  cube(g,0,.09,0,.09,.015,1.8,0xe7e2bf);
 }else if(type==='house'){
  cube(g,0,0,0,1.35,1.1,1.3,0xf0c78d);
  roof(g,0,1.1,0,1.5,.85,1.5,0xb74d3c);
  cube(g,0,.35,.67,.4,.5,.035,0x70b9d8);
  cube(g,.38,.35,.67,.25,.3,.04,0x79502e);
 }else if(type==='tower'){
  cube(g,0,0,0,1.3,4.5,1.3,0x9eafc3);
  for(let y=.4;y<4.3;y+=.65)
   for(let a of [-.42,0,.42])
    cube(g,a,y,.67,.23,.32,.035,0x55b8df);
  cube(g,0,4.5,0,1.5,.18,1.5,0x536779);
 }else if(type==='school'){
  cube(g,0,0,0,1.7,1.7,1.5,0xf3d27b);
  roof(g,0,1.7,0,1.8,.7,1.7,0x477bb5);
  cube(g,0,.8,.77,.55,.7,.04,0x4c9ac2);
 }else if(type==='hospital'){
  cube(g,0,0,0,1.6,2,1.5,0xf2f1e9);
  cube(g,0,2.05,.77,.42,.9,.05,0xd83b47);
  cube(g,0,2.05,.77,.9,.35,.05,0xd83b47);
  for(let a of [-.45,.45])cube(g,a,1,.77,.25,.35,.04,0x72b7d9);
 }else if(type==='shop'){
  cube(g,0,0,0,1.5,1.3,1.4,0xf4c0a3);
  cube(g,0,1.2,0,1.7,.35,1.6,0x3b91a9);
  cube(g,0,.4,.72,.8,.6,.05,0x8dd4ed);
 }else if(type==='park'){
  cube(g,0,0,0,1.9,.12,1.9,0x9acb76);
  tree(g,-.5,.2);tree(g,.5,-.5);tree(g,.4,.6);
 }
 scene.add(g);buildings.push(g);
 return g;
}

const floor=20;
const spacing=2;
function getKey(x,z){return Math.round(x/spacing)+','+Math.round(z/spacing);}

let car;
function makeCar(){
 car=new THREE.Group();
 cube(car,0,.1,0,.55,.3,.9,0xd63b32);
 cube(car,0,.38,-.08,.4,.3,.42,0x83c8e5);
 for(let x of [-.3,.3])for(let z of [-.27,.27]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.09,12),material(0x222222));
  w.rotation.z=Math.PI/2;w.position.set(x,.13,z);car.add(w);
 }
 scene.add(car);car.position.set(3,0,3);
}
makeCar();

let cars=[];
for(let i=0;i<4;i++){
 const c=new THREE.Group();
 cube(c,0,.1,0,.45,.3,.75,[0x2875d4,0xe3ae35,0xeeeeee,0x6d54a4][i]);
 c.position.set(-7+i*4,0,-3);
 scene.add(c);cars.push(c);
}

const markers=[];
function updateCamera(){
 camera.position.set(
 target.x+Math.sin(cameraAngle)*cameraRadius,
 target.y+cameraHeight,
 target.z+Math.cos(cameraAngle)*cameraRadius
 );
 camera.lookAt(target);
}
updateCamera();

document.querySelectorAll('#tools button[data-type]').forEach(b=>{
 b.addEventListener('click',()=>{
  selected=b.dataset.type;
  document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
 });
});
function refresh(){
 document.getElementById('money').textContent=money;
 document.getElementById('count').textContent=buildings.length;
}
document.getElementById('collect').onclick=()=>{
 const earned=buildings.filter((b,i)=>b.userData.type!=='road'&&b.userData.type!=='park').length*20;
 money+=earned;refresh();
 alert('درآمد شهر: '+earned+' سکه');
};

function placeBuilding(event){
 const rect=renderer.domElement.getBoundingClientRect();
 pointer.x=(event.clientX-rect.left)/rect.width*2-1;
 pointer.y=-(event.clientY-rect.top)/rect.height*2+1;
 raycaster.setFromCamera(pointer,camera);
 const p=new THREE.Vector3();
 if(!raycaster.ray.intersectPlane(groundPlane,p))return;
 const x=Math.round(p.x/spacing)*spacing;
 const z=Math.round(p.z/spacing)*spacing;
 const key=getKey(x,z);
 if(Math.abs(x)>16||Math.abs(z)>16||occupied.has(key))return;
 const cost=costs[selected];
 if(money<cost){alert('پول کافی نداری!');return;}
 const b=makeBuilding(selected,x,z);
 b.userData.type=selected;
 occupied.add(key);money-=cost;refresh();
}

let down=null;
let moved=false;
renderer.domElement.addEventListener('pointerdown',e=>{
 down={x:e.clientX,y:e.clientY,angle:cameraAngle};
 moved=false;
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!down)return;
 const dx=e.clientX-down.x;
 const dy=e.clientY-down.y;
 if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
 if(moved){
  cameraAngle=down.angle+dx*.008;
  cameraHeight=Math.max(9,Math.min(30,19+dy*.04));
  updateCamera();
 }
});
renderer.domElement.addEventListener('pointerup',e=>{
 if(down&&!moved)placeBuilding(e);
 down=null;
});
renderer.domElement.addEventListener('wheel',e=>{
 cameraRadius=Math.max(12,Math.min(42,cameraRadius+e.deltaY*.025));
 updateCamera();
});

let touchStart=null;
renderer.domElement.addEventListener('touchmove',e=>{
 if(e.touches.length===2){
  const dx=e.touches[0].clientX-e.touches[1].clientX;
  const dy=e.touches[0].clientY-e.touches[1].clientY;
  const dist=Math.hypot(dx,dy);
  if(touchStart!==null){
   cameraRadius=Math.max(12,Math.min(42,cameraRadius+(touchStart-dist)*.04));
   updateCamera();
  }
  touchStart=dist;
 }
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>touchStart=null);

function animate(){
 requestAnimationFrame(animate);
 cars.forEach((c,i)=>{
  c.position.x+=.012*(i%2===0?1:-1);
  if(c.position.x>9)c.position.x=-9;
  if(c.position.x< -9)c.position.x=9;
 });
 renderer.render(scene,camera);
}
animate();
refresh();
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
